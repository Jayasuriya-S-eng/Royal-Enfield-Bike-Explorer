<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Royal Enfield</title>

    <link href="bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="contact.css">
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-black py-3">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                <img src="assests/image2.png" class="logo" alt="Royal Enfield">
            </a>

            <div>

                <a href="index.html" class="btn nav-btn me-2">Home</a>

                <a href="index.html#models" class="btn nav-btn me-2">Models</a>

                <a href="contact.html" class="btn nav-btn">Contact</a>

            </div>

        </div>

    </nav>

    <!-- Hero -->

    <section class="contact-hero text-center">

        <div class="container">

            <h1 class="display-5 fw-bold">
                Get in Touch with Royal Enfield
            </h1>

            <p class="lead">
                Have questions? Our team is ready to assist you.
            </p>

        </div>

    </section>

    <!-- Contact Section -->

    <section class="py-5">

        <div class="container">

            <div class="row g-4">

                <!-- Left -->

                <div class="col-lg-6">

                    <div class="contact-box h-100">

                        <h2>Our Location</h2>

                        <p>
                            Royal Enfield Headquarter <br>
                            123 Motorcycle Lane, Chennai, India
                        </p>

                        <div class="row g-3 mt-3">

                            <div class="col-6">

                                <img src="assests/location.jpg"
                                    class="img-fluid rounded"
                                    alt="Location">

                            </div>

                            <div class="col-6">

                                <img src="assests/bg.jpg"
                                    class="img-fluid rounded"
                                    alt="Royal Enfield">

                            </div>

                        </div>

                    </div>

                </div>

                <!-- Right -->

                <div class="col-lg-6">

                    <div class="contact-box h-100">

                        <h2>Contact Us</h2>

                        <form>

                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Message
                                </label>

                                <textarea
                                    rows="5"
                                    class="form-control"
                                    required></textarea>

                            </div>

                            <button class="btn submit-btn">
                                Submit
                            </button>

                            <a href="index.html"
                                class="btn home-btn ms-2">

                                Back to Home

                            </a>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Footer -->

    <footer class="bg-black text-center text-white py-4">

        <p class="mb-0">
            © 2025 Royal Enfield. All Rights Reserved.
        </p>

    </footer>

</body>

</html>
